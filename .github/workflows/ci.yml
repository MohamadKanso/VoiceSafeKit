name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check voicesafekit tests benchmarks
      - run: python -m pytest

  zero-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no extras and no dependencies
        run: python -m pip install --no-deps -e . && python -m pip install pytest
      - run: python -m pytest
      - name: Benchmark (SpokenPII)
        run: python benchmarks/run.py

  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,pipecat,livekit]"
      - run: python -m pytest tests/test_pipecat.py tests/test_livekit.py

  gateways:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,litellm,openwebui]"
      - run: python -m pytest tests/test_litellm.py tests/test_openwebui.py tests/test_audio.py
