name: Release

# Publishes to PyPI when a GitHub release is published (tag like v0.6.0).
# Uses PyPI trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org > Publishing > Add a pending publisher:
#   project: voicesafekit, owner: MohamadKanso, repository: VoiceSafeKit,
#   workflow: release.yml, environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag version=$version"
          test "$tag" = "$version" || { echo "Tag v$tag does not match pyproject version $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test the wheel with no dependencies
        run: |
          python -m pip install --no-deps dist/*.whl
          echo "my pin is four eight two one" | voicesafekit redact | grep -q "PIN removed"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only a published GitHub release uploads to PyPI; running the workflow by hand is a dry run.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
