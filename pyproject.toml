[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesafekit"
version = "0.6.0"
description = "Catch spoken PII (card numbers, SSNs, emails said out loud) before voice transcripts reach an LLM. Zero dependencies, Pipecat and LiveKit drop-ins."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamad Kanso" }]
keywords = [
  "voice-assistant",
  "llm-safety",
  "privacy",
  "local-ai",
  "openvoiceos",
  "wyoming",
  "pii-detection",
  "conversation-safety",
  "pii-redaction",
  "speech-to-text",
  "pipecat",
  "livekit",
  "voice-agents",
  "guardrails",
  "open-webui",
  "litellm",
  "audio-redaction",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/MohamadKanso/VoiceSafeKit"
Repository = "https://github.com/MohamadKanso/VoiceSafeKit"
Demo = "https://mohamadkanso.github.io/VoiceSafeKit/"
Changelog = "https://github.com/MohamadKanso/VoiceSafeKit/blob/main/CHANGELOG.md"

[project.scripts]
voicesafekit = "voicesafekit.cli:main"

[project.optional-dependencies]
crypto = ["cryptography>=42"]
pipecat = ["pipecat-ai>=1.0"]
livekit = ["livekit-agents>=1.0"]
audio = ["faster-whisper>=1.0", "numpy"]
openwebui = ["pydantic>=2"]
litellm = ["litellm[proxy]>=1.80"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["voicesafekit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
